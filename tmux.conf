# ~/.tmux.conf
# Seongho's dotfiles

# Prefix key: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
# Use zsh if available, fallback to default shell
if-shell "command -v zsh" "set -g default-shell $(command -v zsh)" ""

# Better colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on close
set -g renumber-windows on

# Scrollback buffer
set -g history-limit 50000
